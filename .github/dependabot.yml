version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week, so a compromised version is usually caught before it is proposed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Node types must describe the oldest runtime the extension supports: VS Code 1.105 runs Node 22.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # VS Code types must not be newer than engines.vscode, or vsce refuses to package; raise both together.
      - dependency-name: '@types/vscode'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
